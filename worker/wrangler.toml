# ugc-api — the ONE worker replacing ugc-worker + sav-content-library app routes
# 🔑 Khian before first deploy:
#   1. wrangler d1 create ugc_library         → paste database_id below
#   2. wrangler d1 migrations apply ugc_library --remote
#   3. wrangler secret put GEMINI_API_KEY
#      wrangler secret put RAPIDAPI_KEY
#      wrangler secret put API_TOKENS         → JSON: {"khian":"<sha256hex>","niko":"<sha256hex>"}
#      (hash a token: echo -n "<the-token>" | shasum -a 256)
#   4. wrangler deploy
name = "ugc-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# SMART PLACEMENT (2026-09-01). By default a Worker runs in the colo nearest the USER — for
# this account that is Jakarta/Singapore, and Gemini refuses that egress with
# 400 FAILED_PRECONDITION "User location is not supported", which killed /analyze uploads even
# after three retries. Smart Placement moves execution to a colo near the BACKEND instead,
# which changes the geography Google sees.
#
# Latency cost is negligible here: every request already spends seconds inside Gemini.
# NOTE: requires the Workers PAID plan. On the free plan this key is ignored rather than
# fatal, so it is safe to leave in place either way.
[placement]
mode = "smart"

[vars]
# Pinned from live ListModels 2026-07-21 (best available Pro; avoid "-latest" aliases — traceability).
# 2026-08-29: PRIMARY moved off the preview model. gemini-3.1-pro-preview was returning
# 400 FAILED_PRECONDITION "User location is not supported for the API use." from the
# Cloudflare colo serving this account, which failed all 3 /generate variants at once.
# Evidence it is MODEL-scoped, not country-scoped: all 169 library formats were rescored
# through gemini-2.5-pro from the same egress on 2026-08-28/29, succeeding (with occasional
# intermittent refusals that the retry ladder now absorbs). GA models carry wider regional
# availability than previews — which is the whole reason a preview id was a risky primary.
GEMINI_MODEL = "gemini-2.5-pro"
# Tier 3 of the generate ladder must be a DIFFERENT, independently-reachable model or it is
# not a fallback. Flash is GA and has been serving the perception passes from this egress
# throughout, so it is a real escape hatch rather than a second way to fail.
GEMINI_MODEL_FALLBACK = "gemini-2.5-flash"
# Kept so the preview can be flipped back in one edit once Google widens its regions.
GEMINI_MODEL_PREVIEW = "gemini-3.1-pro-preview"
# Fast tier for Pass-A boundary scans, micro-passes, and the text-only virality essay.
# gemini-2.5-flash validated live on this pipeline 2026-07-21 (golden test); swap to a
# gemini-3.x flash id via var if/when ListModels shows one.
GEMINI_MODEL_FAST = "gemini-2.5-flash"
# The virality scorer runs on PRO, not FAST. This number decides which library blueprints
# get reused for every downstream generation, so it is the last place to save money —
# measured at roughly $3-6 to score the whole 169-format library.
GEMINI_MODEL_SCORER = "gemini-2.5-pro"
ALLOWED_ORIGINS = "https://manus-anus-spec.github.io,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
# §P2 spend guards: per-operator, per-UTC-day call caps on the two endpoints that cost
# Gemini money. High enough that normal work never notices; low enough that a leaked token
# or a runaway automation retry loop is bounded. Requires migration 0005 (api_usage);
# without it the guard degrades to allow-and-warn rather than blocking paid work.
DAILY_CAP_ANALYZE = "60"
DAILY_CAP_GENERATE = "60"

[[d1_databases]]
binding = "DB"
database_name = "ugc_library"
database_id = "66250432-78fa-46ff-adbd-3987d131dddd"

# Self-binding: /generate dispatches each ideation variant as a separate invocation
# (own CPU budget) — the free plan's 10ms CPU cap killed 3-variants-in-one-request
# runs with Cloudflare error 1102 (exceededCpu, live 2026-07-30).
[[services]]
binding = "SELF"
service = "ugc-api"

[observability]
enabled = true
