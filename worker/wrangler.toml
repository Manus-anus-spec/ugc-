# ugc-api — the ONE worker replacing ugc-worker + sav-content-library app routes
# 🔑 Khian before first deploy:
#   1. wrangler d1 create ugc_library         → paste database_id below
#   2. wrangler d1 migrations apply ugc_library --remote
#   3. wrangler secret put GEMINI_API_KEY
#      wrangler secret put RAPIDAPI_KEY
#      wrangler secret put API_TOKENS         → JSON: {"khian":"<sha256hex>","niko":"<sha256hex>"}
#      (hash a token: echo -n "<the-token>" | shasum -a 256)
#   4. wrangler deploy
name = "ugc-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
# Pinned from live ListModels 2026-07-21 (best available Pro; avoid "-latest" aliases — traceability).
GEMINI_MODEL = "gemini-3.1-pro-preview"
GEMINI_MODEL_FALLBACK = "gemini-2.5-pro"
# Fast tier for Pass-A boundary scans, micro-passes, and the text-only virality essay.
# gemini-2.5-flash validated live on this pipeline 2026-07-21 (golden test); swap to a
# gemini-3.x flash id via var if/when ListModels shows one.
GEMINI_MODEL_FAST = "gemini-2.5-flash"
# The virality scorer runs on PRO, not FAST. This number decides which library blueprints
# get reused for every downstream generation, so it is the last place to save money —
# measured at roughly $3-6 to score the whole 169-format library.
GEMINI_MODEL_SCORER = "gemini-2.5-pro"
ALLOWED_ORIGINS = "https://manus-anus-spec.github.io,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
# §P2 spend guards: per-operator, per-UTC-day call caps on the two endpoints that cost
# Gemini money. High enough that normal work never notices; low enough that a leaked token
# or a runaway automation retry loop is bounded. Requires migration 0005 (api_usage);
# without it the guard degrades to allow-and-warn rather than blocking paid work.
DAILY_CAP_ANALYZE = "60"
DAILY_CAP_GENERATE = "60"

[[d1_databases]]
binding = "DB"
database_name = "ugc_library"
database_id = "66250432-78fa-46ff-adbd-3987d131dddd"

# Self-binding: /generate dispatches each ideation variant as a separate invocation
# (own CPU budget) — the free plan's 10ms CPU cap killed 3-variants-in-one-request
# runs with Cloudflare error 1102 (exceededCpu, live 2026-07-30).
[[services]]
binding = "SELF"
service = "ugc-api"

[observability]
enabled = true
